<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>2026-getting-started</title>

		<style>
			
		</style>
	</head>
	<body>
		<div id="app"></div>

		<h1>Guessing Game</h1>

		<div>
			<label for="gameSettings">Game Settings</label>
			<select name="game-settings" id="gameSettings">
				<option value="10-3">1 to 10 with 3 Guesses</option>
				<option value="50-5">1 to 50 with 5 Guesses</option>
				<option value="100-10">1 to 100 with 10 Guesses</option>
				<option value="1000-20">1 to 1,000 with 20 Guesses</option>
			</select>
		</div>
		<div>
			<label for="userAnswer">Enter a number</label>
			<input type="number" name="user-answer" id="userAnswer" />
			<button id="btnAnswer">Answer</button>
			<button id="btnRestart">Start over!</button>
		</div>

		<div id="errorMessage" style="color: red"></div>

		<div id="userMessage" style="color: blue"></div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
